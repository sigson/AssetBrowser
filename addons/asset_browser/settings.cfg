[scan]

frequency_sec=5.0
scan_mode="event_only"
coalesce_ms=250
poll_only_when_visible=true

[tree]

lazy_subdirs=true
rebuild_mode="incremental"
refresh_min_interval_ms=500

[files]

tiles_per_frame=32
tiles_frame_budget_ms=6
virtualize_grid=true
repopulate_min_interval_ms=250
defer_size_column=true

[search]

async=true
nodes_per_frame=256
frame_budget_ms=6
content_max_files=500
content_requires_global_optin=true
debounce_ms=300
max_results=1000

[preview]

cache_mode="engine_lazy"
only_visible=true
max_preview_size_px=256
cache_ttl_sec=180.0
heavy_previews_per_frame=4
heavy_frame_budget_ms=8
cache_sweep_interval_sec=10

[lifecycle]

persist_suspended=false

[layout]

mode="left_hier_right_files"

[nav]

show_parent_folder=false

[spacing]

grid_tile_gap_px=8
list_row_gap_px=2
font_size_px=13
